# Runs on every push to main, and on demand (Actions > Site checks > Run workflow).
# 1. The Arabic page (ar/index.html) was rebuilt from the latest words.
# 2. Once Cloudflare has published main (it waits for that), the live site at https://fellowflow.ai:
#    every page and link answers, the live HTML matches this repository, no console errors on phone
#    or desktop, plus the DNS records of fellowflow.ai and fellowflow.si (read the log for those).
name: Site checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A newer push replaces a run that is still waiting for the older one to go live.
concurrency:
  group: site-checks
  cancel-in-progress: true
jobs:
  arabic-page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ar/index.html matches index.html and the AR list in site.js
        run: node tools/build-ar.mjs --check
  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a headless browser
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.49.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the live site (after a push, first waits up to 10 minutes for Cloudflare to publish it)
        run: NODE_PATH=/tmp/pw/node_modules WAIT=${{ github.event_name == 'push' && 600 || 0 }} node tools/live-check.cjs
